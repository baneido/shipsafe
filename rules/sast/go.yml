# AI-generated code detection rules — Go.
# Error-handling and concurrency mistakes common in AI-generated Go.
rules:
  - id: ai-go-empty-error-check
    pattern: |
      if $ERR != nil {
      }
    message: >
      Empty error-check block silently swallows the error. AI-generated Go
      often stubs error handling. Return, wrap, or log the error.
    languages: [go]
    severity: ERROR
    metadata:
      category: correctness
      subcategory: [ai-generated]
      cwe: "CWE-390: Detection of Error Condition Without Action"
      confidence: HIGH

  - id: ai-go-discarded-error
    patterns:
      - pattern: $VAL, _ = $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: .*(Open|Create|Read|Write|Close|Exec|Query|Marshal|Unmarshal|Parse).*
    message: >
      Error from an I/O or parsing call discarded with `_`. Check the error;
      ignoring it hides failures that AI-generated code assumes cannot happen.
    languages: [go]
    severity: WARNING
    metadata:
      category: correctness
      subcategory: [ai-generated]
      cwe: "CWE-252: Unchecked Return Value"
      confidence: MEDIUM

  - id: ai-go-goroutine-loop-capture
    patterns:
      - pattern-inside: |
          for $I, $V := range $ITER {
            ...
          }
      - pattern: go func() { <... $V ...> }()
    message: >
      Goroutine captures the loop variable by reference — in Go < 1.22 every
      iteration shares the same variable, a classic data race in AI-generated
      code. Pass the variable as a parameter: go func(v T) { ... }(v).
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      confidence: MEDIUM

  - id: ai-go-shell-command-concat
    pattern-either:
      - pattern: exec.Command("sh", "-c", $A + $B)
      - pattern: exec.Command("bash", "-c", $A + $B)
      - pattern: exec.Command("sh", "-c", fmt.Sprintf(...))
      - pattern: exec.Command("bash", "-c", fmt.Sprintf(...))
    message: >
      Shell command built from concatenated/formatted input — a command
      injection risk. Invoke the binary directly with separate arguments:
      exec.Command(prog, arg1, arg2).
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
