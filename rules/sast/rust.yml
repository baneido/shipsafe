# AI-generated code detection rules — Rust.
# AI assistants reach for unsafe shortcuts that compile but are unsound.
rules:
  - id: ai-rust-mem-transmute
    pattern: std::mem::transmute($X)
    message: >
      std::mem::transmute reinterprets memory and is almost never what
      AI-generated code actually needs. Prefer safe conversions (From/Into,
      to_bits/from_bits, byte-order methods).
    languages: [rust]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-843: Access of Resource Using Incompatible Type"
      confidence: HIGH

  - id: ai-rust-static-mut
    pattern: |
      static mut $NAME: $TYPE = $INIT;
    message: >
      `static mut` allows data races and is rejected in Rust 2024. Use
      OnceLock, Mutex, or an atomic type for shared mutable state.
    languages: [rust]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization"
      confidence: HIGH

  - id: ai-rust-unsafe-block
    pattern: unsafe { ... }
    message: >
      Unsafe block detected. AI-generated code sometimes uses `unsafe` to
      silence the borrow checker without a soundness argument. Verify the
      invariants and document them with a `// SAFETY:` comment, or rewrite
      using safe APIs.
    languages: [rust]
    severity: WARNING
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-119: Improper Restriction of Operations within the Bounds of a Memory Buffer"
      confidence: LOW

  - id: ai-rust-unwrap-in-spawned-thread
    patterns:
      - pattern: $X.unwrap()
      - pattern-inside: std::thread::spawn(...)
    message: >
      .unwrap() inside a spawned thread panics silently (the panic is only
      surfaced when the JoinHandle is joined). Handle the error or propagate
      it through the JoinHandle.
    languages: [rust]
    severity: WARNING
    metadata:
      category: correctness
      subcategory: [ai-generated]
      cwe: "CWE-248: Uncaught Exception"
      confidence: MEDIUM
