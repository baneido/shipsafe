rules:
  - id: ai-hardcoded-credentials
    pattern: |
      $VAR = "$PASSWORD"
    message: >
      Hardcoded credential detected. This is a common pattern in
      AI-generated code. Use environment variables or a secrets manager.
    languages: [python, javascript, typescript, rust, go, java]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-798: Use of Hard-coded Credentials"

  - id: ai-sql-injection
    patterns:
      - pattern: |
          $QUERY = f"... {$INPUT} ..."
      - pattern: |
          $QUERY = "..." + $INPUT + "..."
    message: >
      Potential SQL injection. AI code generators often produce
      string-concatenated queries. Use parameterized queries instead.
    languages: [python, javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-89: SQL Injection"

  - id: ai-missing-auth-check
    pattern: |
      @app.route("$PATH", methods=["$METHOD"])
      def $FUNC(...):
          ...
    pattern-not-inside: |
      @login_required
      ...
    message: >
      Route handler without authentication check. AI-generated
      endpoints often lack proper auth middleware.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-306: Missing Authentication"
