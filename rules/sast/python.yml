# AI-generated code detection rules — Python.
# Patterns that AI code assistants (Copilot, Cursor, ChatGPT) commonly produce.
rules:
  - id: ai-py-hardcoded-credentials
    patterns:
      - pattern: $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|passwd|secret|api_key|apikey|token|private_key|access_key|auth_key).*
      - pattern-not: $KEY = ""
      - pattern-not: $KEY = "${...}"
    message: >
      Hardcoded credential assigned to a sensitive-looking variable. AI code
      generators often inline example credentials. Load secrets from
      environment variables or a secrets manager instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM

  - id: ai-py-sql-injection-concat
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute("..." + $X)
          - pattern: $CURSOR.execute("..." + $X + "...")
          - pattern: $CURSOR.execute("..." % $X)
          - pattern: $CURSOR.execute("...".format(...))
          - pattern: $CURSOR.execute(f"...{$X}...")
          - pattern: $CURSOR.executemany("..." + $X)
          - pattern: $CURSOR.executemany(f"...{$X}...")
    message: >
      SQL query built via string concatenation or formatting. AI code
      generators frequently produce string-interpolated SQL. Use
      parameterized queries (cursor.execute(sql, params)) instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      confidence: HIGH

  - id: ai-py-flask-sensitive-route-no-auth
    patterns:
      - pattern: |
          @$APP.route($PATH, ...)
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route($PATH, ...)
          @login_required
          def $FUNC(...):
              ...
      - pattern-not: |
          @login_required
          @$APP.route($PATH, ...)
          def $FUNC(...):
              ...
      - metavariable-regex:
          metavariable: $PATH
          regex: .*(admin|delete|settings|internal).*
    message: >
      Sensitive route handler without an authentication decorator. AI-generated
      endpoints often omit auth middleware. Add @login_required (or your auth
      decorator) to admin/destructive routes.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-306: Missing Authentication for Critical Function"
      confidence: MEDIUM

  - id: ai-py-unsafe-yaml-load
    patterns:
      - pattern: yaml.load($X)
      - pattern-not: yaml.load($X, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($X, Loader=yaml.CSafeLoader)
    message: >
      yaml.load() without SafeLoader can execute arbitrary Python objects.
      Use yaml.safe_load() instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH

  - id: ai-py-eval-on-input
    pattern-either:
      - pattern: eval(input(...))
      - pattern: eval(request.$ATTR[...])
      - pattern: eval(request.$ATTR.get(...))
      - pattern: exec(input(...))
      - pattern: exec(request.$ATTR[...])
      - pattern: exec(request.$ATTR.get(...))
    message: >
      eval()/exec() on user-controlled input allows arbitrary code execution.
      Validate and parse the input explicitly (e.g. ast.literal_eval for
      literals) instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      confidence: HIGH

  - id: ai-py-subprocess-shell-format
    patterns:
      - pattern-either:
          - pattern: subprocess.run(f"...{$X}...", shell=True, ...)
          - pattern: subprocess.call(f"...{$X}...", shell=True, ...)
          - pattern: subprocess.Popen(f"...{$X}...", shell=True, ...)
          - pattern: subprocess.run("..." + $X, shell=True, ...)
          - pattern: subprocess.call("..." + $X, shell=True, ...)
          - pattern: subprocess.Popen("..." + $X, shell=True, ...)
          - pattern: os.system(f"...{$X}...")
          - pattern: os.system("..." + $X)
    message: >
      Shell command built from interpolated data. This is a command injection
      risk common in AI-generated code. Pass an argument list without
      shell=True instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      subcategory: [ai-generated]
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      confidence: HIGH
