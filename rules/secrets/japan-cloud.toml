# ShipSafe gitleaks extension: Japanese cloud / SaaS credential patterns.
# Loaded on top of the gitleaks default ruleset (useDefault = true).
title = "ShipSafe Japan cloud rules"

[extend]
useDefault = true

# さくらのクラウド: API key is an access-token / secret pair.
[[rules]]
id = "sakura-cloud-api-key"
description = "Sakura Cloud API access token"
regex = '''(?i)sakura[\w.-]{0,24}?(?:token|secret|key)['"]?\s*[:=]\s*['"]([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[A-Za-z0-9]{32,64})['"]'''
secretGroup = 1
keywords = ["sakura"]

# LINE Messaging API: long-lived channel access token (base64-like, 100+ chars).
[[rules]]
id = "line-channel-access-token"
description = "LINE channel access token"
regex = '''(?i)(?:line[\w.-]{0,24}?)?channel[\w.-]{0,12}?(?:access[_-]?)?token['"]?\s*[:=]\s*['"]([A-Za-z0-9+/=]{100,200})['"]'''
secretGroup = 1
keywords = ["channel"]

# LINE Messaging API: channel secret (32 hex chars).
[[rules]]
id = "line-channel-secret"
description = "LINE channel secret"
regex = '''(?i)(?:line[\w.-]{0,24}?)?channel[\w.-]{0,12}?secret['"]?\s*[:=]\s*['"]([0-9a-f]{32})['"]'''
secretGroup = 1
keywords = ["channel"]

# PayPay for Developers: API key / secret.
[[rules]]
id = "paypay-api-key"
description = "PayPay API key or secret"
regex = '''(?i)paypay[\w.-]{0,24}?(?:key|secret)['"]?\s*[:=]\s*['"]([A-Za-z0-9+/=_-]{16,64})['"]'''
secretGroup = 1
keywords = ["paypay"]

# freee API: OAuth2 access token / client secret.
[[rules]]
id = "freee-access-token"
description = "freee API access token or client secret"
regex = '''(?i)freee[\w.-]{0,24}?(?:token|secret)['"]?\s*[:=]\s*['"]([A-Za-z0-9]{32,128})['"]'''
secretGroup = 1
keywords = ["freee"]

# kintone: app/API token.
[[rules]]
id = "kintone-api-token"
description = "kintone API token"
regex = '''(?i)kintone[\w.-]{0,24}?token['"]?\s*[:=]\s*['"]([A-Za-z0-9]{32,64})['"]'''
secretGroup = 1
keywords = ["kintone"]
