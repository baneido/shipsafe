name: 'ShipSafe Security Scan'
description: 'AI-Powered Pre-Deploy Security Gate - SAST, SCA, and Secrets scanning in one action'
author: 'Baneido, Inc.'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  scanners:
    description: 'Comma-separated list of scanners to run (sast,sca,secrets)'
    required: false
    default: 'sast,sca,secrets'
  fail-on:
    description: 'Minimum severity to fail the build (critical,high,medium,low)'
    required: false
    default: 'critical'
  format:
    description: 'Output format (table,json,sarif)'
    required: false
    default: 'sarif'
  lang:
    description: 'Output language (en,ja)'
    required: false
    default: 'en'
  config:
    description: 'Path to .shipsafe.yml config file'
    required: false
    default: '.shipsafe.yml'
  pr-comment:
    description: 'Post results as PR comment'
    required: false
    default: 'true'
  version:
    description: 'ShipSafe version to use'
    required: false
    default: 'latest'

outputs:
  findings-count:
    description: 'Total number of findings'
  critical-count:
    description: 'Number of critical findings'
  sarif-file:
    description: 'Path to SARIF output file'

runs:
  using: 'composite'
  steps:
    - name: Install ShipSafe
      shell: bash
      run: |
        curl -sSL https://install.shipsafe.dev | sh -s -- --version ${{ inputs.version }}

    - name: Install scanner dependencies
      shell: bash
      run: |
        pip install semgrep --break-system-packages || pip install semgrep
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o /usr/local/bin/gitleaks && chmod +x /usr/local/bin/gitleaks

    - name: Run ShipSafe Scan
      id: scan
      shell: bash
      run: |
        set +e
        shipsafe scan \
          --scanners "${{ inputs.scanners }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --format "${{ inputs.format }}" \
          --lang "${{ inputs.lang }}" \
          --config "${{ inputs.config }}" \
          --output shipsafe-results.sarif
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub Security
      if: inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: shipsafe-results.sarif
      continue-on-error: true

    - name: Enforce fail-on threshold
      if: steps.scan.outputs.exit-code != '0'
      shell: bash
      run: |
        EXIT_CODE="${{ steps.scan.outputs.exit-code }}"
        if [ "$EXIT_CODE" = "1" ]; then
          echo "::error::ShipSafe found findings at or above '${{ inputs.fail-on }}' severity"
        else
          echo "::error::ShipSafe scan failed to run (exit code $EXIT_CODE)"
        fi
        exit 1
