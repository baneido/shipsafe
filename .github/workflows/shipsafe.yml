# Self-scan: run the local ShipSafe composite action on this repository.
# Serves as the end-to-end test for the action (install, scan, SARIF upload
# to the Security tab, and PR comments).
name: ShipSafe Self-Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the workflow level; the scan job opts into what it needs.
permissions: {}

jobs:
  shipsafe:
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout
      security-events: write  # upload SARIF to the Security tab
      pull-requests: write    # post scan results as PR comments
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: ShipSafe scan (local action)
        uses: ./
        with:
          fail-on: critical
          format: sarif
          pr-comment: 'true'
          upload-sarif: 'true'
