version: 1

scanners:
  sast:
    enabled: true
    rules:
      - "owasp-top-10"
      - "ai-generated-code"
    # Deliberately vulnerable fixtures and rule test files.
    exclude:
      - "fixtures"
      - "rules"
      - "tests/**"
      - "target/**"

  sca:
    enabled: true
    fail-on-severity: critical

  secrets:
    enabled: true
    allow-patterns:
      - "fixtures/vulnerable-sample-app/"
      - "rules/sast/"
      # Unit-test fixtures for the JP cloud rules live in the scanner source.
      - "src/scanners/secrets.rs"

output:
  format: table
  lang: ja

ai:
  triage: false
  fix-suggestions: false

# Applied to findings from every scanner.
exclude:
  - "fixtures/**"
  - "rules/**"
