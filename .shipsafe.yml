version: 1

scanners:
  sast:
    enabled: true
    rules:
      - "owasp-top-10"
    exclude:
      - "tests/**"
      - "target/**"

  sca:
    enabled: true
    fail-on-severity: high

  secrets:
    enabled: true
    allow-patterns: []

output:
  format: table
  lang: ja

ai:
  triage: false
  fix-suggestions: false
