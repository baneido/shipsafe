version: 1

scanners:
  sast:
    enabled: true
    rules:
      - "owasp-top-10"
    # Deliberately vulnerable fixtures and rule test files.
    exclude:
      - "fixtures"
      - "rules"
      - "tests/**"
      - "target/**"

  sca:
    enabled: true
    fail-on-severity: critical

  secrets:
    enabled: true
    allow-patterns:
      - "fixtures/vulnerable-sample-app/"
      - "rules/sast/"
      # Unit-test fixtures for the JP cloud rules live in the scanner source.
      - "src/scanners/secrets.rs"

output:
  format: table
  lang: ja

# AI triage (opt-in; requires ANTHROPIC_API_KEY). False positives stay in
# the report but are excluded from the --fail-on gate.
ai:
  triage: false
  model: claude-opus-4-8
  max-findings: 50
  timeout-seconds: 120

# Applied to findings from every scanner.
exclude:
  - "fixtures/**"
  - "rules/**"
